name: Build and Release Native Installers

on:
  push:
    branches: [ develop ]

jobs:
  build-native-installers:
    name: Build Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Defines the operating systems for the build matrix
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn --batch-mode clean install

      - name: Upload built installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: target/jpackage
          # Retains the artifact after the workflow run for the release job
          retention-days: 1

  build-android:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Setup GraalVM with JavaFX
        uses: graalvm/setup-graalvm@v1
        with:
          # Using Liberica NIK distribution which includes JavaFX
          distribution: 'liberica'
          java-version: '17'
          java-package: 'jdk+fx'  # Crucial for JavaFX support:cite[8]
          cache: 'maven'  # Caches Maven dependencies for faster builds:cite[1]:cite[2]

      - name: Build with Maven
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
          mvn -B clean gluonfx:build gluonfx:package

      - name: Upload built installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: target/gluonfx/aarch64-android/gvm/testfx.apk
          # Retains the artifact after the workflow run for the release job
          retention-days: 1

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-native-installers, build-android]
    # Specifies the permissions for the GITHUB_TOKEN
    permissions:
      contents: write
      
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: assembled-artifacts
          # Required to download artifacts from other jobs
          pattern: installer-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Automated Build ${{ github.sha }}
          body: |
            Native installers built from development branch.
            This is an automated release.
          files: assembled-artifacts/**/*
