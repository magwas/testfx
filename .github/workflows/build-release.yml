name: Build and Release Native Installers

on:
  push:
    branches: [ develop ]

jobs:
  build-native-installers:
    name: Build Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Defines the operating systems for the build matrix
        os: [ubuntu-latest, windows-latest]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: mvn --batch-mode clean install

      - name: Upload built installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: target/jpackage
          # Retains the artifact after the workflow run for the release job
          retention-days: 1

  build-android:
    name: build android
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libavcodec-dev libavformat-dev \
          libavutil-dev libfreetype6-dev libgl-dev libglib2.0-dev libgtk-3-dev \
          libpango1.0-dev libx11-dev libxtst-dev

      - name: Setup Gluon GraalVM
        run: |
          GRAALVM_URL="https://github.com/gluonhq/graal/releases/download/gluon-22.1.0.1-Final/graalvm-svm-java17-linux-gluon-22.1.0.1-Final.tar.gz"
          wget -O graalvm.tar.gz $GRAALVM_URL
          tar -xzf graalvm.tar.gz
          echo "GRAALVM_HOME=$PWD/graalvm-svm-java17-linux-gluon-22.1.0.1-Final" >> $GITHUB_ENV
          echo "$PWD/graalvm-svm-java17-linux-gluon-22.1.0.1-Final/bin" >> $GITHUB_PATH

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - uses: actions/cache@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build with Maven
        run: |
          echo "GRAALVM_HOME: $GRAALVM_HOME"
          echo "JAVA_HOME: $JAVA_HOME"
          java --version
          native-image --version
          unset ANDROID_SDK_ROOT
          mvn -B clean gluonfx:build gluonfx:package

      - name: Upload built installer
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: target/gluonfx/aarch64-android/gvm/testfx.apk
          # Retains the artifact after the workflow run for the release job
          retention-days: 1

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            target/gluonfx/**/*.log

  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: [build-native-installers, build-android]
    # Specifies the permissions for the GITHUB_TOKEN
    permissions:
      contents: write
      
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: assembled-artifacts
          # Required to download artifacts from other jobs
          pattern: installer-*
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: build-${{ github.sha }}
          name: Automated Build ${{ github.sha }}
          body: |
            Native installers built from development branch.
            This is an automated release.
          files: assembled-artifacts/**/*
